<!DOCTYPE html>
<html>
<head>

    <title>Image Matching Project</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        input {
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        .results {
            margin-top: 30px;
            text-align: left;
        }

        .result {
            padding: 12px;
            margin: 8px 0;
            background: #f1f1f1;
            border-radius: 6px;
        }

        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Image Matching & Face Detection</h1>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <br>

        <button type="submit">
            Check Image
        </button>

    </form>


    {% if viola %}

    <div class="results">

        <h2>Results</h2>

        <div class="result">
            <strong>Template Matching:</strong>
            {{ template }}
        </div>

        <div class="result">
            <strong>Viola-Jones:</strong>
            {{ viola }}
        </div>

        <div class="result">
            <strong>DeepFace:</strong>
            {{ deepface }}
        </div>

        <div class="result">
            <strong>FaceNet:</strong>
            {{ facenet }}
        </div>

    </div>

    {% endif %}


    {% if image %}

        <h3>Uploaded Image</h3>

        <img src="/{{ image }}" width="400">

    {% endif %}

</div>

</body>
</html>
